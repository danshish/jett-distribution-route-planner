name: Build Jett Pal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/offline-valhalla-native

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Inspect Valhalla Android engine package
        run: |
          mkdir -p /tmp/valhalla-check
          curl -fL --retry 3 -o /tmp/valhalla-check/engine.aar https://repo.maven.apache.org/maven2/ai/mapmap/valhalla-engine/3.9.1-1/valhalla-engine-3.9.1-1.aar
          echo "Engine AAR size: $(du -h /tmp/valhalla-check/engine.aar | cut -f1)"
          unzip -l /tmp/valhalla-check/engine.aar | tee /tmp/valhalla-check/contents.txt
          echo "Native Android libraries found:"
          unzip -Z1 /tmp/valhalla-check/engine.aar | grep -E '^jni/[^/]+/.*\\.so        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jett-Pal-APK
          path: android/app/build/outputs/apk/release/app-release.apk
 || true
          if ! unzip -Z1 /tmp/valhalla-check/engine.aar | grep -q '^jni/arm64-v8a/.*\\.so        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jett-Pal-APK
          path: android/app/build/outputs/apk/release/app-release.apk
; then
            echo "ERROR: AAR does not contain an arm64-v8a native library."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jett-Pal-APK
          path: android/app/build/outputs/apk/release/app-release.apk
