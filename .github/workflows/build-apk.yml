name: Build Jett Pal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/offline-valhalla-native

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Inspect Valhalla Android engine package
        run: |
          mkdir -p /tmp/valhalla-check
          curl -fL --retry 3 -o /tmp/valhalla-check/engine.aar https://repo.maven.apache.org/maven2/ai/mapmap/valhalla-engine/3.9.1-1/valhalla-engine-3.9.1-1.aar
          echo "Engine AAR size: $(du -h /tmp/valhalla-check/engine.aar | cut -f1)"
          unzip -l /tmp/valhalla-check/engine.aar
          echo "Native Android libraries found:"
          unzip -Z1 /tmp/valhalla-check/engine.aar | grep -E '^jni/[^/]+/.*\.so$' || true
          if ! unzip -Z1 /tmp/valhalla-check/engine.aar | grep -q '^jni/arm64-v8a/.*\.so$'; then
            echo "ERROR: AAR does not contain an arm64-v8a native library."
            exit 1
          fi

      - name: Inspect Valhalla wrapper and dependency metadata
        run: |
          mkdir -p /tmp/valhalla-check
          curl -fL --retry 3 -o /tmp/valhalla-check/mobile.aar https://repo.maven.apache.org/maven2/io/github/rallista/valhalla-mobile/0.6.4/valhalla-mobile-0.6.4.aar
          curl -fL --retry 3 -o /tmp/valhalla-check/mobile.pom https://repo.maven.apache.org/maven2/io/github/rallista/valhalla-mobile/0.6.4/valhalla-mobile-0.6.4.pom
          curl -fL --retry 3 -o /tmp/valhalla-check/engine.pom https://repo.maven.apache.org/maven2/ai/mapmap/valhalla-engine/3.9.1-1/valhalla-engine-3.9.1-1.pom
          echo "=== Valhalla Mobile POM ==="
          cat /tmp/valhalla-check/mobile.pom
          echo "=== Valhalla Engine POM ==="
          cat /tmp/valhalla-check/engine.pom
          echo "=== Wrapper AAR classes ==="
          unzip -l /tmp/valhalla-check/mobile.aar
          unzip -p /tmp/valhalla-check/mobile.aar classes.jar > /tmp/valhalla-check/mobile-classes.jar
          jar tf /tmp/valhalla-check/mobile-classes.jar | grep -E 'Valhalla.class|ValhallaConfigFactory.class|ValhallaResponse' || true

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Diagnose generated Gradle JVM targets
        run: |
          echo "=== Generated app/build.gradle ==="
          sed -n '1,260p' android/app/build.gradle
          echo "=== Generated root build.gradle ==="
          sed -n '1,220p' android/build.gradle
          echo "=== All generated JVM target declarations ==="
          grep -RniE 'sourceCompatibility|targetCompatibility|jvmTarget|JavaCompile|kotlinOptions|compilerOptions' android --include='*.gradle' --include='*.gradle.kts' || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jett-Pal-APK
          path: android/app/build/outputs/apk/release/app-release.apk
