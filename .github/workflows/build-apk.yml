name: Build Jett Pal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Set up Gradle and restore build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle download retries
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            grep -q '^retries=' android/gradle/wrapper/gradle-wrapper.properties || echo 'retries=3' >> android/gradle/wrapper/gradle-wrapper.properties
            grep -q '^retryBackOffMs=' android/gradle/wrapper/gradle-wrapper.properties || echo 'retryBackOffMs=1500' >> android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Configure permanent Android signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 GitHub secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD GitHub secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS GitHub secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD GitHub secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/jett-upload-key.jks
          test -s android/app/jett-upload-key.jks

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jett-Pal-APK
          path: android/app/build/outputs/apk/release/app-release.apk
